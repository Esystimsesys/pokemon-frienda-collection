name: ずかんデータの定期更新

# 公式サイト(pokemonfrienda.com)を毎週見に行って、新しいだん・券面の
# 読み取りぬけが無いか確認する。scripts/update.sh をそのまま動かすだけで、
# ここに更新ロジックは書かない（手元で npm run update するのと同じ中身にする）。
#
# 券面の文字読み取り(scripts/ocr/*.swift)が Apple の Vision フレームワークを
# 使うため、Ubuntu ランナーでは動かない。macOS ランナーで実行する。
#
# 差分が出たら、そのまま main へは push せず、必ず Pull Request にする。
# OCRの読みちがい（テラスタルの読み落としなど、過去に実例あり）が
# レビュー無しで公開されないようにするため。
on:
  schedule:
    # 07:00 JST 毎週月曜（UTC 表記なので 9 時間ぶん前）
    - cron: "0 22 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # deploy.yml と同じにしておく
          cache: npm

      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install Pillow

      # 券面の画像・公式ページのHTMLはリポジトリに入れていない（再取得できるため）。
      # 前回ぶんをキャッシュしておくと、変わっていない958枚を毎週落とし直さずに済む。
      - uses: actions/cache@v4
        with:
          path: |
            scripts/raw/official
            scripts/raw/pick_images
          key: frienda-raw-cache

      # わざ名の読み取り(scripts/ocr/move_ocr.py)は Apple Vision を使う都合で
      # swiftc -O のフルビルドが必要で、これに40分前後かかる。毎回ゼロから
      # ビルドし直さないよう、ソースが変わっていないときだけビルド済みバイナリを使う。
      - uses: actions/cache@v4
        id: ocr-build-cache
        with:
          path: scripts/ocr/build
          key: frienda-ocr-build-${{ hashFiles('scripts/ocr/*.swift') }}

      - name: キャッシュしたOCRツールを使い回す
        if: steps.ocr-build-cache.outputs.cache-hit == 'true'
        run: |
          # actions/checkout はソース側のmtimeをチェックアウト時刻にそろえてしまい、
          # 「ソースの方が新しい」と見えて再ビルドされてしまう。
          # キャッシュキーがswiftファイルの中身そのものなので、ヒットした時点で
          # 中身が一致していることは保証されている。mtimeだけ前へずらして再ビルドを避ける。
          find scripts/ocr/build -type f -exec touch {} +

      # 更新後との比較に使う。JSONの行差分は1万行を超えてレビューできないので、
      # ピック単位の要約(scripts/diff_summary.py)を作ってPR本文に載せる。
      - name: 更新前の picks.json を控える
        run: cp src/data/picks.json /tmp/picks_before.json

      - name: 公式サイトを見に行ってデータを作り直す
        run: bash scripts/update.sh

      - name: 差分があるか確認
        id: diff
        run: |
          git add -A -- src/data scripts/raw
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Request を作る（あれば中身を更新する）
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C auto/update-data
          git commit -m "data: 公式サイトの最新データを取り込む"
          git push --force origin auto/update-data

          {
            python3 scripts/diff_summary.py /tmp/picks_before.json
            printf '\n---\n\n'
            printf '%s\n' \
              '`scripts/update.sh` の定期実行（毎週月曜 朝）による自動更新です。' \
              '' \
              '**「値が失われた」が0件でないときは、そのままマージしないこと。**' \
              'OCRは環境によって読み取り結果がぶれることがあり、実際にCIのApple Visionが' \
              '手元のMacより多く読み落とした例があります。原因を確かめてから判断してください。' \
              '' \
              '手元で内容を確かめる手順は `docs/review-update-pr.md` にあります。'
          } > /tmp/pr_body.md

          if gh pr view auto/update-data --json state -q .state 2>/dev/null | grep -q OPEN; then
            # すでに開いているPRがあるときは、本文を今回の内容に置きかえる
            gh pr edit auto/update-data --body-file /tmp/pr_body.md
          else
            gh pr create \
              --base main \
              --head auto/update-data \
              --title "data: 公式サイトの最新データを取り込む" \
              --reviewer Esystimsesys \
              --body-file /tmp/pr_body.md
          fi
